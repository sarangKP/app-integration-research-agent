[project]
name = "tool-agent"
version = "0.1.0"
description = "Agent that researches 100 SaaS apps for integration readiness (auth, access, API, MCP, buildability)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "composio>=0.34.0",
    "firecrawl-py>=4.57.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "pandas>=3.1.1",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "typer>=0.29.2",
]

[project.scripts]
research = "research_agent.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
